name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Syntax check JavaScript files
        run: |
          set -e
          # Run node --check on all tracked JS files in src/ to catch syntax errors without starting the bot
          for f in $(git ls-files 'src/**/*.js' 'src/*.js' || true); do
            echo "Checking $f"
            node --check "$f"
          done
